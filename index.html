<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="description" content="ZERO ONE is a creative marketing agency building brands, campaigns and digital experiences." />
    <meta property="og:title" content="ZERO ONE — Creative Marketing Agency" />
    <meta property="og:description" content="We build brands, campaigns, and digital experiences that make businesses impossible to ignore." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZERO ONE" />
    <meta property="og:image" content="/ONE.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZERO ONE — Creative Marketing Agency" />
    <meta name="twitter:description" content="We build brands, campaigns, and digital experiences that make businesses impossible to ignore." />
    <meta name="twitter:image" content="/ONE.png" />
    <link rel="icon" type="image/png" href="/ONE.png" />
    <title>ZERO ONE — Creative Marketing Agency</title>
    <style>
      #zero-one-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #111111;
        opacity: 1;
        visibility: visible;
        transition: opacity 700ms cubic-bezier(.77,0,.18,1), visibility 700ms;
      }
      #zero-one-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .zero-one-loader__inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .zero-one-loader__logo {
        width: clamp(110px, 16vw, 180px);
        height: auto;
        display: block;
        object-fit: contain;
        animation: zero-one-logo-in 1200ms cubic-bezier(.16,1,.3,1) both;
      }
      .zero-one-loader__line {
        width: 0;
        height: 1px;
        background: #F14A0B;
        animation: zero-one-line-in 1000ms 450ms cubic-bezier(.16,1,.3,1) forwards;
      }
      .zero-one-loader__label {
        margin-top: -14px;
        color: rgba(247,245,240,.45);
        font: 600 9px/1 system-ui, sans-serif;
        letter-spacing: .34em;
        text-transform: uppercase;
        opacity: 0;
        animation: zero-one-label-in 700ms 650ms ease forwards;
      }
      @keyframes zero-one-logo-in {
        from { opacity: 0; transform: translateY(18px) scale(.88); filter: blur(10px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }
      @keyframes zero-one-line-in {
        from { width: 0; opacity: 0; }
        to { width: clamp(70px, 10vw, 120px); opacity: 1; }
      }
      @keyframes zero-one-label-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #zero-one-loader,
        .zero-one-loader__logo,
        .zero-one-loader__line,
        .zero-one-loader__label { animation: none; transition: none; }
        .zero-one-loader__logo { opacity: 1; }
        .zero-one-loader__line { width: clamp(70px, 10vw, 120px); opacity: 1; }
        .zero-one-loader__label { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="zero-one-loader" aria-label="Loading ZERO ONE" role="status">
      <div class="zero-one-loader__inner">
        <img class="zero-one-loader__logo" src="/ONE.png" alt="ZERO ONE" />
        <span class="zero-one-loader__line" aria-hidden="true"></span>
        <span class="zero-one-loader__label">Creative Marketing Agency</span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var loader = document.getElementById('zero-one-loader');
        var hide = function () {
          if (!loader) return;
          loader.classList.add('is-hidden');
          window.setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 750);
        };
        if (document.readyState === 'complete') {
          window.setTimeout(hide, 500);
        } else {
          window.addEventListener('load', function () {
            window.setTimeout(hide, 500);
          }, { once: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
