name: Remove Team System

on:
  push:
    paths:
      - '.github/workflows/remove-team-system.yml'

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove Team route and files
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/main.tsx')
          s = path.read_text(encoding='utf-8')
          s = s.replace("import EmployeeTaskBoard from './admin/EmployeeTaskBoard';\n", '')
          s = s.replace("  if (path === '/team' || path === '/team/tasks') return <EmployeeTaskBoard />;\n", '')
          path.write_text(s, encoding='utf-8')
          for name in ['src/admin/EmployeeTaskBoard.tsx', 'src/admin/TeamTaskBoard.tsx', 'src/admin/EmployeeTaskBoard.css', 'src/admin/TeamTaskBoard.css']:
              p = Path(name)
              if p.exists(): p.unlink()
      - name: Verify production build
        run: |
          npm install
          npm run build
      - name: Commit removal and cleanup workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/remove-team-system.yml
          git commit -m 'chore: remove Team system completely'
          git push
